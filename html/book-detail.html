            <div class="page" id="page1">

                    <label for="page1_checkbox"></label>

                <div class="back_page">
                    <label for="page1_checkbox"></label>

            </div>

            <div class="page" id="page2">
                <div class="front_page">
                    <label for="page2_checkbox"></label>
                    <img class="edge_shading" src="/assets/page4.png" alt="Front page edge shading">
                    <img class="front_content" src="/assets/page5.png" alt="Front content">
                </div>

                <div class="back_page">
                    <label for="page2_checkbox"></label>
                    <img class="edge_shading" src="/assets/page6.png" alt="Back page edge shading">

            </div>

            <div class="page" id="page3">
                <div class="front_page">
                    <label for="page3_checkbox"></label>

                    <img class="front_content" src="/assets/page5.png" alt="Front content">

                <div class="back_page">
                    <label for="page3_checkbox"></label>
                    <img class="edge_shading" src="/assets/page6.png" alt="Back page edge shading">
                    <img class="back_content" src="/assets/page7.png" alt="Back content">

            </div>

            <div class="page" id="page4">
                <div class="front_page">
                    <label for="page4_checkbox"></label>
                    <img class="edge_shading" src="/assets/page1.png" alt="Front page edge shading">
                    <img class="front_content" src="/assets/page5.png" alt="Front content">

            <div class="back_cover"></div>

        <button id="toggle-mode-btn">

    </main>                <button id="addToLibraryBtn" class="btn-add-library">Add to My Library</button>
                <button id="removeFromLibraryBtn" class="btn-remove-library" style="display: none;">Remove from Library</button>
            </div>

            <div class="book-info-section">
                <h1 id="bookTitle" class="book-title"></h1>
                <p id="bookAuthor" class="book-author"></p>
                <div class="book-rating">
                    <span id="bookRating" class="stars"></span>
                    <span id="ratingNumber" class="rating-number"></span>
                </div>

                <div class="book-meta">
                    <div class="meta-item">
                        <strong>Category:</strong>
                        <span id="bookCategory"></span>
                    </div>
                    <div class="meta-item">
                        <strong>Pages:</strong>
                        <span id="bookPages"></span>
                    </div>
                    <div class="meta-item">
                        <strong>Status:</strong>
                        <span id="bookStatus"></span>
                    </div>
                </div>

                <div class="book-description">
                    <h3>Description</h3>
                    <p id="bookDescription"></p>
                </div>

                <div class="book-actions">
                    <select id="statusSelect" class="status-select">
                        <option value="">Select Reading Status</option>
                        <option value="Want to Read">Want to Read</option>
                        <option value="Reading">Reading</option>
                        <option value="Finished">Finished</option>
                    </select>

                    <div class="date-inputs">
                        <input type="date" id="startDate" placeholder="Start Date">
                        <input type="date" id="endDate" placeholder="End Date">
                    </div>

                    <textarea id="notesArea" placeholder="Add your notes about this book..." class="notes-area"></textarea>
                </div>

                <button id="saveBtnDetails" class="btn-save">Save to Library</button>
            </div>
        </div>

  <script>
    (function(){
      var ham = document.querySelector('.bs-hamburger');
      var nav = document.getElementById('bsMobileNav');
      var close = document.getElementById('bsNavClose');
      if(ham && nav) {
        ham.addEventListener('click', function(){ nav.classList.add('bs-nav-open'); });
      }
      if(close && nav) {
        close.addEventListener('click', function(){ nav.classList.remove('bs-nav-open'); });
      }
      if(nav) {
        nav.addEventListener('click', function(e){
          if(e.target === nav) nav.classList.remove('bs-nav-open');
        });
      }
    })();
  </script>
